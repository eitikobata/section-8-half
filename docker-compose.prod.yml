# ============================================================================
# PRODUCTION OVERRIDES — section-8-half
# ============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires .env.production with real secrets sourced into the shell/compose.

services:
  postgres:
    ports: [] # not exposed publicly in production
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always

  redis:
    ports: []
    command: redis-server --appendonly yes
    restart: always

  backend:
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    ports: [] # only reachable via reverse proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_URL}
    ports: [] # only reachable via reverse proxy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # Uncomment if not using EasyPanel / an external reverse proxy:
