# ============================================================================
# PRODUCTION COMPOSE — section-8-half
# ============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#        (this extends the base compose with production overrides)
#
# Or run standalone:
# docker-compose -f docker-compose.prod.yml up -d
#
# Assumes:
# - .env.production is present with real secrets
# - SSL certificates are mounted at /etc/nginx/ssl
# - A reverse proxy (nginx) sits in front

version: '3.9'

services:
  postgres:
    # No ports exposed in production (only internal access)
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Must be set from .env.production
    restart: always
    # Add backup/replica settings as needed

  redis:
    # No ports exposed in production
    ports: []
    # Optional: add Redis persistence/backup
    command: redis-server --appendonly yes
    restart: always

  backend:
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      COOKIE_SECURE: 'true' # HTTPS only
      # Secrets must come from .env.production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
    
    # No ports exposed (behind nginx)
    ports: []
    
    # No source mount (use built image only)
    volumes: []
    
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WS_URL: ${BACKEND_URL}
    
    # No ports exposed (behind nginx)
    ports: []
    
    # No source mount (use built image only)
    volumes: []
    
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # =========================================================================
  # Nginx Reverse Proxy (optional, if not using external reverse proxy)
  # =========================================================================
  # Uncomment this section if you want nginx as part of the compose
  # Otherwise, configure your external reverse proxy (EasyPanel, Traefik, etc.)
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: section8half-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - section8half-network
