# ============================================================================
# EASYPANEL DEPLOYMENT — section-8-half
# ============================================================================
# Unlike docker-compose.yml (used for local dev, which spins up its own
# Postgres), this file assumes Postgres already exists elsewhere on the
# VPS -- a shared instance used across projects -- and only runs Redis,
# backend, and frontend.
#
# Requires a database already created on the shared Postgres for this
# project (see notes below) and .env.production with real secrets.

services:
  redis:
    image: redis:7-alpine
    container_name: section8half-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - section8half_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - section8half-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: section8half-backend
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
      # Shared Postgres instance -- not a container in this compose file.
      # DB_NAME must be a database that already exists on tools_postgres-shared
      # (create it once with `CREATE DATABASE section8half;`, see notes below).
      DATABASE_URL: postgresql://postgres:${SHARED_POSTGRES_PASSWORD}@tools_postgres-shared:5432/${DB_NAME:-section8half}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-events:stream}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-analyst-demo}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_DEBUG: 'false'
      CORRELATION_WINDOW_MS: ${CORRELATION_WINDOW_MS:-60000}
      CORRELATION_EVENT_THRESHOLD: ${CORRELATION_EVENT_THRESHOLD:-3}
      CORRELATION_SEVERITY_THRESHOLD: ${CORRELATION_SEVERITY_THRESHOLD:-50}
      CORRELATION_CONSUMER_GROUP: ${CORRELATION_CONSUMER_GROUP:-correlation-engine}
      CORRELATION_BLOCK_MS: ${CORRELATION_BLOCK_MS:-5000}
      CORRELATION_BATCH_COUNT: ${CORRELATION_BATCH_COUNT:-10}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - section8half-network
      - tools-shared-network # must match the network tools_postgres-shared is actually on -- see notes below

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: section8half-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_INCIDENT_DECISION_TIMEOUT_MS: ${NEXT_PUBLIC_INCIDENT_DECISION_TIMEOUT_MS:-120000}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    networks:
      - section8half-network

volumes:
  section8half_redis_data:
    driver: local

networks:
  section8half-network:
    driver: bridge
  # This must be the actual Docker network tools_postgres-shared is
  # attached to, or the backend won't be able to resolve/reach that
  # hostname at all. Find the real name in EasyPanel (or `docker network
  # ls` / `docker inspect tools_postgres-shared` on the VPS) and replace
  # the placeholder below -- "external: true" means docker-compose
  # expects this network to already exist, not create a new one.
  tools-shared-network:
    external: true
    name: REPLACE_WITH_ACTUAL_NETWORK_NAME
