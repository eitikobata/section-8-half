
services:
  postgres:
    image: postgres:16-alpine
    container_name: section8half-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: section8half
    ports:
      - "5432:5432"
    volumes:
      - section8half_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: section8half-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - section8half_redis_data:/data

volumes:
  section8half_postgres_data:
  section8half_redis_data:
