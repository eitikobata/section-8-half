services:
  postgres:
    image: postgres:16-alpine
    container_name: section8half-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-section8half}
    ports:
      - "5432:5432"
    volumes:
      - section8half_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-section8half}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - section8half-network

  redis:
    image: redis:7-alpine
    container_name: section8half-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - section8half_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - section8half-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: section8half-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-section8half}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_STREAM_KEY: ${REDIS_STREAM_KEY:-events:stream}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-analyst-demo}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo12345}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_DEBUG: ${AI_DEBUG:-false}
      CORRELATION_WINDOW_MS: ${CORRELATION_WINDOW_MS:-60000}
      CORRELATION_EVENT_THRESHOLD: ${CORRELATION_EVENT_THRESHOLD:-3}
      CORRELATION_SEVERITY_THRESHOLD: ${CORRELATION_SEVERITY_THRESHOLD:-50}
      CORRELATION_CONSUMER_GROUP: ${CORRELATION_CONSUMER_GROUP:-correlation-engine}
      CORRELATION_CONSUMER_NAME: ${CORRELATION_CONSUMER_NAME:-}
      CORRELATION_BLOCK_MS: ${CORRELATION_BLOCK_MS:-5000}
      CORRELATION_BATCH_COUNT: ${CORRELATION_BATCH_COUNT:-10}
    ports:
      - "3000:3000"
    networks:
      - section8half-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: section8half-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000}
      NEXT_PUBLIC_INCIDENT_DECISION_TIMEOUT_MS: ${NEXT_PUBLIC_INCIDENT_DECISION_TIMEOUT_MS:-120000}
    ports:
      - "3001:3001"
    networks:
      - section8half-network

volumes:
  section8half_postgres_data:
    driver: local
  section8half_redis_data:
    driver: local

networks:
  section8half-network:
    driver: bridge
